version: '3.8'

services:
  server_docker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: server_docker
    ports:
      - "5000:5000"
      - "5005:5005"
    volumes:
      - ./Backend/.env:/app/.env

  front_docker:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: front_docker
    ports:
      - "5173:5173"

